# WLED holiday scheduler settings.
# Edit and save any time - the running scheduler picks up changes at its next wake-up
# (or immediately with:  py wled_holiday_scheduler.py --reload).
# A mistake is logged and ignored; the previous good settings stay in force.
# Check a file without applying it:  py wled_holiday_scheduler.py --check
# Lines starting with # or ; are comments.

[controller]
; REQUIRED: the IP address (or hostname) of your WLED controller, e.g. 192.168.1.50
host = 
; yes = also store tonight's preset (or 'off' by day) as the controller's power-on default, so it
; comes back correct after a power loss without waiting for the scheduler
set_power_on_default = yes

[location]
; REQUIRED: your latitude and longitude in decimal degrees (look yourself up on any map site).
; North and East are positive; South and West are negative (the US is negative longitude).
latitude = 
longitude = 
; optional: an IANA timezone name such as America/Chicago or Europe/London; blank = this computer's timezone
timezone = 

[timing]
sunset_offset_min = 0        ; lights ON this many minutes after sunset (negative = earlier)
sunrise_offset_min = 60       ; lights OFF this many minutes after sunrise
pre_roll_min = 59             ; start the fast wake cadence this long before lights-on
slow_seconds = 3600           ; daytime wake interval (clock check only)
fast_seconds = 900            ; evening-to-morning wake interval
config_poll_seconds = 0        ; 0 = look for .ini edits only at normal wake-ups or --reload;
                               ; e.g. 60 = also glance at the file's date every minute (very cheap)

[presets]
; which WLED preset slot each name uses (names are the section/holiday names below)
ou = 2
thanksgiving = 3
valentines = 4
stpatricks = 5
armedforces = 6
memorial = 7
flag = 8
july4 = 9
labor = 10
columbus = 11
halloween = 12
veterans = 13
christmas = 14
newyear = 15
easter = 18
usaf = 27
usmc = 28
mlk = 62
presidents = 63
patriot = 64
cinco = 65
mardigras = 66
groundhog = 67
superbowl = 68
capitals = 69
birthday = 70

[windows]
; nights_before, nights_after: how many evenings before / after the holiday date get lights.
; Lights run through sunrise (+offset) of the morning after the last lit night, so
; '7, 1' = starts 7 evenings before and the last lit night is the evening after the holiday,
;  ending at sunrise (+1h) on the 2nd morning after.
; Anything not listed uses default.
default = 14, 7          ; major holidays: 2 weeks before .. 1 week after
valentines = 1, 0         ; Valentine's Day, Feb 14
stpatricks = 7, 1         ; St. Patrick's Day, Mar 17
easter = 7, 1             ; Easter Sunday
usaf = 1, 0               ; Air Force birthday, Sep 18
armedforces = 7, 1        ; Armed Forces Day, 3rd Sat of May
memorial = 14, 7          ; Memorial Day
flag = 7, 1               ; Flag Day, Jun 14
july4 = 14, 7             ; 4th of July
labor = 7, 1              ; Labor Day
columbus = 7, 1           ; Columbus Day
halloween = 14, 7         ; Halloween, Oct 31
mlk = 1, 0                ; Martin Luther King Jr. Day, 3rd Mon of Jan
presidents = 1, 0         ; Presidents Day, 3rd Mon of Feb
groundhog = 1, 0          ; Groundhog Day, Feb 2
mardigras = 1, 0          ; Mardi Gras (Fat Tuesday)
cinco = 1, 0              ; Cinco de Mayo, May 5
patriot = 1, 0            ; Patriot Day, Sep 11
superbowl = 1, 0          ; Super Bowl Sunday (dates under [custom_holidays])
capitals = 0, 0           ; your team's game nights (dates under [custom_holidays])

[custom_holidays]
; Add your own holiday: name = MM-DD   or   name = n,weekday,month  (e.g. 3,sat,5 = 3rd Saturday of May;
; use 'last' for the last one, e.g. last,mon,5)   or   name = YYYY-MM-DD, YYYY-MM-DD, ...  (explicit
; dates for things that move around, like the Super Bowl or your team's game nights).
; Then give it a slot in [presets] and (optionally) a window in [windows].
; An explicit-date event wins over other holidays on its own day.
superbowl = 2027-02-14, 2028-02-13
capitals = 
; capitals: list your team's game nights as YYYY-MM-DD, comma separated (tonight only)

[events]
; One-off special events, checked FIRST (they even beat OU game nights).
; name = first evening .. last evening  (YYYY-MM-DD). Needs a slot in [presets]. Delete the line afterwards or leave it.
;   myevent = 2027-06-04 .. 2027-06-06       ; (needs a matching slot under [presets])

[birthdays]
; person = MM-DD. Each gets the night before + the day, using the 'birthday' preset.
;   alex = 03-05

[seasons]
; Special stretches, checked in this order (first match wins; OU game nights beat all of these).
; name = first evening .. last evening.  Dates: MM-DD, thanksgiving, or any holiday name,
; optionally with +/- days (thanksgiving+1 = Black Friday). Ranges may cross New Year.
usmc = 11-09 .. 11-10
veterans = 11-11 .. 11-11
thanksgiving = 11-01 .. thanksgiving
christmas = thanksgiving+1 .. 12-28
newyear = 12-29 .. 01-02

[ou]
; yes = light a game-day look (the 'ou' preset) on the nights below. Name is historical; any team works.
enabled = no
; actual holiday days that an OU game must NOT override (MM-DD)
exempt = 09-11, 09-18, 10-31, 11-10, 11-11, 12-24, 12-25, 12-31
; if a year has no games_YYYY line below, light OU on EVERY Saturday from late Aug to early Dec
fallback_every_saturday = no
; extra one-off OU nights (playoff / bowl / SEC Championship): YYYY-MM-DD, comma separated
extra_dates =
; games_2027 = 08-28, 09-04     ; one line per year: MM-DD of each home/away game night

[midnight_switch]
; On the night that BEGINS on this evening date, switch to another preset after midnight.
time = 00:01
11-10 = veterans            ; Marine Corps birthday night -> Veterans Day at 12:01 AM
